<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELSHA — Product Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2c45;--blue:#3f6c9a;--bg:#eef3f7;--line:#d3dee8;--soft:#5b6780;--mustard:#e3a92f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",sans-serif;padding:20px}
.wrap{max-width:850px;margin:24px auto}.head,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
h1{margin:0;font-size:30px}h2{margin:0 0 14px}.muted{color:var(--soft)}label{display:block;font-weight:600;margin:13px 0 5px}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:16px inherit;color:var(--ink);background:#fff}
textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:11px 18px;font:600 16px "Hind Siliguri";cursor:pointer;margin:8px 6px 0 0}.btn.alt{background:var(--mustard);color:var(--ink)}.btn.light{background:#e9eff5;color:var(--ink)}.btn.danger{background:#a83232}
.status{padding:10px 12px;border-radius:8px;background:#f0f4f8;margin-top:12px;white-space:pre-wrap}.hidden{display:none!important}
.item{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}.item img{width:74px;height:74px;object-fit:cover;border-radius:8px;background:#eef3f7}.item .info{flex:1;min-width:0}.item strong{display:block}.item small{color:var(--soft)}.actions{display:flex;flex-wrap:wrap;gap:5px}
.preview{max-width:150px;max-height:150px;object-fit:cover;border-radius:10px;margin-top:10px}
.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){body{padding:10px}.head,.panel{padding:16px}.item{align-items:flex-start}.item img{width:60px;height:60px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="head topline"><div><h1>ELSHA Admin</h1><div class="muted">পণ্য যোগ, সম্পাদনা ও স্টক নিয়ন্ত্রণ</div></div><a href="index.html">ওয়েবসাইট দেখুন</a></div>
 <section class="panel" id="loginPanel">
  <h2>Admin Login</h2>
  <label for="email">ইমেইল</label><input id="email" type="email" autocomplete="username" placeholder="Admin email">
  <label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button class="btn" id="loginBtn">লগইন</button><div class="status" id="loginStatus">আপনার Supabase Auth ইমেইল ও পাসওয়ার্ড ব্যবহার করুন।</div>
 </section>
 <section class="panel hidden" id="appPanel">
  <div class="topline"><h2 id="formTitle">নতুন পণ্য যোগ করুন</h2><button class="btn light" id="logoutBtn">লগআউট</button></div>
  <form id="productForm">
   <input id="productId" type="hidden">
   <label for="name">পণ্যের নাম *</label><input id="name" required maxlength="160" placeholder="যেমন: Floral Crochet Cardigan">
   <label for="subtitle">Subtitle</label><input id="subtitle" placeholder="রং, ধরন বা ছোট পরিচিতি">
   <label for="description">Description</label><textarea id="description" placeholder="পণ্যের বিস্তারিত বিবরণ"></textarea>
   <label for="features">Features (প্রতি লাইনে একটি)</label><textarea id="features" placeholder="হাতে বোনা&#10;নরম ও আরামদায়ক&#10;রং ও সাইজ কাস্টমাইজ করা যায়"></textarea>
   <label for="price">Price</label><input id="price" placeholder="যেমন: ৳১,২৫০">
   <label for="stock">Stock Quantity *</label><input id="stock" type="number" min="0" step="1" value="0" required>
   <label for="photo">পণ্যের ছবি</label><input id="photo" type="file" accept="image/*">
   <img id="preview" class="preview hidden" alt="ছবির প্রিভিউ">
   <div class="muted" id="imageNote">ছবি না দিলে আগের ছবিটি (এডিটের সময়) অপরিবর্তিত থাকবে।</div>
   <button class="btn alt" id="saveBtn" type="submit">পণ্য সেভ করুন</button>
   <button class="btn light" id="resetBtn" type="button">ফর্ম পরিষ্কার</button>
  </form>
  <div class="status" id="formStatus">পণ্য যোগ করতে ফর্ম পূরণ করুন।</div>
  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
  <div class="topline"><h2>আপনার পণ্যসমূহ</h2><button class="btn light" id="refreshBtn">রিফ্রেশ</button></div>
  <div id="productList" class="muted">পণ্য লোড হচ্ছে...</div>
 </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ncvfevqhzsupzkbjyqld.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_zl9gUQxyZP4UVLNzu73_tw_ilyvI2tE";
const BUCKET="products-images";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let currentUser=null, products=[], existingImage="";
function status(id,msg){$(id).textContent=msg}
function showApp(user){currentUser=user;$("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");loadProducts()}
async function checkSession(){const {data,error}=await supabaseClient.auth.getSession();if(error){status("loginStatus",error.message);return}if(data.session)showApp(data.session.user)}
$("loginBtn").addEventListener("click",async()=>{status("loginStatus","লগইন হচ্ছে...");const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){status("loginStatus","লগইন হয়নি: "+error.message);return}showApp(data.user)});
$("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();currentUser=null;$("appPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");status("loginStatus","লগআউট হয়েছে।")});
function resetForm(){ $("productForm").reset();$("productId").value="";$("stock").value="0";existingImage="";$("preview").src="";$("preview").classList.add("hidden");$("formTitle").textContent="নতুন পণ্য যোগ করুন";$("saveBtn").textContent="পণ্য সেভ করুন";status("formStatus","পণ্য যোগ করতে ফর্ম পূরণ করুন।")}
$("resetBtn").addEventListener("click",resetForm);
$("photo").addEventListener("change",()=>{const f=$("photo").files[0];if(!f)return;if(!f.type.startsWith("image/")){status("formStatus","অনুগ্রহ করে image ফাইল নির্বাচন করুন।");$("photo").value="";return}if(f.size>5*1024*1024){status("formStatus","ছবির সাইজ ৫ MB-এর কম হতে হবে।");$("photo").value="";return}$("preview").src=URL.createObjectURL(f);$("preview").classList.remove("hidden")});
async function uploadPhoto(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path="products/"+Date.now()+"-"+Math.random().toString(36).slice(2,9)+"."+ext;const {error}=await supabaseClient.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw new Error("ছবি আপলোড হয়নি: "+error.message);const {data}=supabaseClient.storage.from(BUCKET).getPublicUrl(path);return data.publicUrl}
$("productForm").addEventListener("submit",async e=>{e.preventDefault();if(!currentUser){status("formStatus","আগে Admin Login করুন।");return}const save=$("saveBtn");save.disabled=true;status("formStatus","পণ্য সেভ হচ্ছে...");try{let image_url=existingImage;const file=$("photo").files[0];if(file)image_url=await uploadPhoto(file);const payload={name:$("name").value.trim(),subtitle:$("subtitle").value.trim(),description:$("description").value.trim(),features:$("features").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),price:$("price").value.trim(),stock_qty:Number($("stock").value),image_url};if(!payload.name)throw new Error("পণ্যের নাম লিখুন।");if(!Number.isInteger(payload.stock_qty)||payload.stock_qty<0)throw new Error("Stock Quantity শূন্য বা তার বেশি পূর্ণসংখ্যা হতে হবে।");let result;if($("productId").value){result=await supabaseClient.from("products").update(payload).eq("id",$("productId").value).select()}else{result=await supabaseClient.from("products").insert(payload).select()}if(result.error)throw result.error;status("formStatus","সফল! পণ্য Supabase-এ সেভ হয়েছে।");resetForm();await loadProducts()}catch(err){status("formStatus","সমস্যা: "+(err.message||String(err)))}finally{save.disabled=false}});
async function loadProducts(){status("productList","পণ্য লোড হচ্ছে...");const {data,error}=await supabaseClient.from("products").select("*").order("created_at",{ascending:false});if(error){status("productList","পণ্য লোড হয়নি: "+error.message);return}products=data||[];renderList()}
function renderList(){const root=$("productList");root.replaceChildren();if(!products.length){root.textContent="এখনও কোনো পণ্য যোগ করা হয়নি।";return}products.forEach(p=>{const row=document.createElement("div");row.className="item";if(p.image_url){const img=document.createElement("img");img.src=p.image_url;img.alt=p.name;row.appendChild(img)}const info=document.createElement("div");info.className="info";const title=document.createElement("strong");title.textContent=p.name;const sub=document.createElement("small");sub.textContent=(p.subtitle||"")+" · Stock: "+(p.stock_qty??0)+(p.price?" · "+p.price:"");info.append(title,sub);row.appendChild(info);const actions=document.createElement("div");actions.className="actions";const edit=document.createElement("button");edit.className="btn light";edit.textContent="Edit";edit.addEventListener("click",()=>editProduct(p.id));const del=document.createElement("button");del.className="btn danger";del.textContent="Delete";del.addEventListener("click",()=>deleteProduct(p.id));actions.append(edit,del);row.appendChild(actions);root.appendChild(row)})}
function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;$("productId").value=p.id;$("name").value=p.name||"";$("subtitle").value=p.subtitle||"";$("description").value=p.description||"";$("features").value=Array.isArray(p.features)?p.features.join("\n"):"";$("price").value=p.price||"";$("stock").value=p.stock_qty??0;existingImage=p.image_url||"";if(existingImage){$("preview").src=existingImage;$("preview").classList.remove("hidden")}else $("preview").classList.add("hidden");$("photo").value="";$("formTitle").textContent="পণ্য সম্পাদনা করুন";$("saveBtn").textContent="পরিবর্তন সেভ করুন";status("formStatus","এখন তথ্য পরিবর্তন করে সেভ করুন।");window.scrollTo({top:0,behavior:"smooth"})}
async function deleteProduct(id){if(!confirm("এই পণ্যটি মুছে ফেলবেন?"))return;const {error}=await supabaseClient.from("products").delete().eq("id",id);if(error){status("formStatus","Delete হয়নি: "+error.message);return}status("formStatus","পণ্য মুছে ফেলা হয়েছে।");await loadProducts()}
$("refreshBtn").addEventListener("click",loadProducts);
checkSession();
</script>
</body>
</html>
