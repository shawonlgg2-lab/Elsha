<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELSHA Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2c45;--blue:#3f6c9a;--bg:#eef3f7;--line:#d3dee8;--soft:#5b6780;--mustard:#e3a92f;--red:#a83232;--green:#2f7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font-size:26px;font-weight:700;letter-spacing:.14em;padding:0 10px 18px}
.brand small{display:block;font-size:13px;letter-spacing:0;font-weight:400;opacity:.7}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;color:#cfd9e6;text-align:left;padding:11px 12px;border-radius:10px;cursor:pointer}
.nav button.on{background:#fff;color:var(--ink);font-weight:600}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side a{color:#cfd9e6;padding:6px 12px;font-size:15px}
main{padding:26px;max-width:960px;width:100%}
h1{font-size:28px;margin:0 0 4px}h2{font-size:20px;margin:0 0 12px}
.muted{color:var(--soft)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:34px;line-height:1.1}
.stat.warn b{color:var(--red)}.stat.good b{color:var(--green)}
.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--mustard);color:var(--ink)}.btn.light{background:#e4ecf3;color:var(--ink)}.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:14px}.btn:disabled{opacity:.5}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}
input[type=checkbox]{width:auto}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:2;min-width:160px}.bar select{flex:1;min-width:130px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:#fff}
.item img,.item .noimg{width:66px;height:66px;object-fit:cover;border-radius:9px;background:var(--bg);flex:none}
.item .info{flex:1;min-width:0}.item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--soft)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.stock{display:flex;align-items:center;gap:6px}.stock b{min-width:24px;text-align:center}
.tag{display:inline-block;font-size:13px;padding:1px 9px;border-radius:99px;background:#e4ecf3}
.tag.off{background:#f3dede;color:var(--red)}.tag.low{background:#fbefd0}
.cats{display:flex;flex-wrap:wrap;gap:8px}.cats span{background:#e4ecf3;border-radius:99px;padding:4px 14px}
dialog{border:0;border-radius:16px;padding:22px;width:min(560px,94vw);max-height:92vh;color:var(--ink)}
dialog::backdrop{background:rgba(31,44,69,.55)}
.preview{width:120px;height:120px;object-fit:cover;border-radius:10px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:50;max-width:90vw}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
@media(max-width:760px){
 .shell{display:block}
 .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:20;justify-content:space-around}
 .brand,.side .foot{display:none}
 .nav{flex-direction:row;width:100%}.nav button{flex:1;text-align:center;padding:10px 4px;font-size:14px}
 main{padding:16px 14px 90px}.row{grid-template-columns:1fr}
 .item{flex-wrap:wrap}.acts{width:100%;justify-content:flex-start}
}
</style>
</head>
<body>

<section class="login" id="loginPanel">
 <div class="card">
  <h1>ELSHA Dashboard</h1>
  <p class="muted">অ্যাডমিন ইমেইল ও পাসওয়ার্ড দিয়ে ঢুকুন।</p>
  <label for="email">ইমেইল</label><input id="email" type="email" autocomplete="username">
  <label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="margin-top:14px">লগইন</button>
  <p class="muted" id="loginStatus"></p>
 </div>
</section>

<div class="shell hidden" id="app">
 <aside class="side">
  <div class="brand">ELSHA<small>ড্যাশবোর্ড</small></div>
  <nav class="nav">
   <button data-view="overview" class="on">ওভারভিউ</button>
   <button data-view="products">পণ্য</button>
   <button data-view="settings">সেটিংস</button>
  </nav>
  <div class="foot"><a href="index.html" target="_blank" rel="noopener">ওয়েবসাইট দেখুন</a><button class="btn light sm" id="logoutBtn">লগআউট</button></div>
 </aside>

 <main>
  <section id="v-overview">
   <h1>ওভারভিউ</h1><div class="muted">আপনার দোকানের বর্তমান অবস্থা</div>
   <div class="stats" id="stats"></div>
   <div class="card"><h2>ক্যাটাগরি</h2><div class="cats" id="catList"></div></div>
   <div class="card"><h2>স্টক কম বা শেষ</h2><div id="lowList"></div></div>
   <div class="card"><h2>সর্বশেষ যোগ করা পণ্য</h2><div id="recentList"></div></div>
  </section>

  <section id="v-products" class="hidden">
   <div class="bar" style="justify-content:space-between;align-items:center">
    <div><h1>পণ্য</h1><div class="muted" id="countLine"></div></div>
    <button class="btn alt" id="addBtn">+ নতুন পণ্য</button>
   </div>
   <div class="bar">
    <input id="search" type="search" placeholder="নাম দিয়ে খুঁজুন" aria-label="পণ্য খুঁজুন">
    <select id="catFilter" aria-label="ক্যাটাগরি"></select>
    <select id="stateFilter" aria-label="অবস্থা"><option value="">সব অবস্থা</option><option value="visible">দেখা যাচ্ছে</option><option value="hidden">লুকানো</option><option value="out">স্টক শেষ</option></select>
   </div>
   <div id="productList"></div>
  </section>

  <section id="v-settings" class="hidden">
   <h1>সাইট সেটিংস</h1><div class="muted">এখানে বদলালে সাইটের তথ্য বদলে যাবে</div>
   <div class="card" style="margin-top:16px">
    <label for="s_tagline">ট্যাগলাইন</label><input id="s_tagline">
    <label for="s_announcement">উপরের ঘোষণা বার</label><input id="s_announcement" placeholder="যেমন: বাংলাদেশজুড়ে ডেলিভারি">
    <label for="s_phone">ফোন নম্বর</label><input id="s_phone" inputmode="tel">
    <label for="s_address">ঠিকানা</label><input id="s_address">
    <label for="s_facebook">ফেসবুক পেজ লিংক</label><input id="s_facebook" type="url">
    <button class="btn alt" id="saveSettings" style="margin-top:16px">সেটিংস সেভ করুন</button>
   </div>
  </section>
 </main>
</div>

<dialog id="dlg">
 <form id="productForm">
  <h2 id="formTitle">নতুন পণ্য</h2>
  <input id="productId" type="hidden">
  <label for="name">পণ্যের নাম *</label><input id="name" required maxlength="160">
  <label for="subtitle">সাবটাইটেল</label><input id="subtitle" placeholder="রং বা ছোট পরিচিতি">
  <div class="row">
   <div><label for="category">ক্যাটাগরি</label><input id="category" list="catOptions" placeholder="যেমন: কার্ডিগান"><datalist id="catOptions"></datalist></div>
   <div><label for="price">দাম</label><input id="price" placeholder="৳১,২৫০"></div>
  </div>
  <label for="stock">স্টক সংখ্যা *</label><input id="stock" type="number" min="0" step="1" value="0" required>
  <label for="description">বিবরণ</label><textarea id="description"></textarea>
  <label for="features">বৈশিষ্ট্য (প্রতি লাইনে একটি)</label><textarea id="features"></textarea>
  <label for="photo">ছবি (৫ MB পর্যন্ত)</label><input id="photo" type="file" accept="image/*">
  <img id="preview" class="preview hidden" alt="ছবির প্রিভিউ">
  <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="is_visible" checked> সাইটে দেখান</label>
  <div class="muted" id="formStatus" style="margin-top:8px"></div>
  <div style="margin-top:12px"><button class="btn alt" id="saveBtn" type="submit">পণ্য সেভ করুন</button> <button class="btn light" type="button" id="cancelBtn">বাতিল</button></div>
 </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ncvfevqhzsupzkbjyqld.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_zl9gUQxyZP4UVLNzu73_tw_ilyvI2tE";
const BUCKET="products-images";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const LOW=3;
let products=[],existingImage="",user=null;

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function toast(msg){const t=el("div","toast",msg);document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const stock=p=>Number(p.stock_qty??0);
const visible=p=>p.is_visible!==false;

/* ---------- Auth ---------- */
function enter(u){user=u;$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden");loadProducts();loadSettings()}
(async()=>{const {data}=await sb.auth.getSession();if(data.session)enter(data.session.user)})();
$("loginBtn").onclick=async()=>{$("loginStatus").textContent="লগইন হচ্ছে...";const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){$("loginStatus").textContent="লগইন হয়নি: "+error.message;return}enter(data.user)};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---------- Navigation ---------- */
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["overview","products","settings"].forEach(v=>$("v-"+v).classList.toggle("hidden",v!==b.dataset.view));
});

/* ---------- Products: load + render ---------- */
async function loadProducts(){
 const {data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
 if(error){toast("পণ্য লোড হয়নি: "+error.message);return}
 products=data||[];renderAll();
}
function renderAll(){renderOverview();renderFilters();renderList()}

function renderOverview(){
 const out=products.filter(p=>stock(p)<=0),low=products.filter(p=>stock(p)>0&&stock(p)<=LOW),hid=products.filter(p=>!visible(p));
 const S=$("stats");S.replaceChildren();
 [["মোট পণ্য",products.length,""],["সাইটে দেখা যাচ্ছে",products.length-hid.length,"good"],["লুকানো",hid.length,""],["স্টক শেষ",out.length,out.length?"warn":""],["স্টক কম",low.length,low.length?"warn":""]]
  .forEach(([l,n,c])=>{const d=el("div","stat "+c);d.append(el("b","",n.toLocaleString("bn-BD")),el("span","muted",l));S.appendChild(d)});
 const cats={};products.forEach(p=>{const c=(p.category||"").trim()||"ক্যাটাগরি নেই";cats[c]=(cats[c]||0)+1});
 const C=$("catList");C.replaceChildren();
 Object.entries(cats).forEach(([c,n])=>C.appendChild(el("span","",c+" · "+n.toLocaleString("bn-BD"))));
 if(!products.length)C.textContent="পণ্য যোগ করলে ক্যাটাগরি এখানে দেখা যাবে।";
 const L=$("lowList");L.replaceChildren();
 const need=[...out,...low];
 if(!need.length)L.textContent="সব পণ্যের স্টক ঠিক আছে।";
 need.forEach(p=>L.appendChild(row(p,true)));
 const R=$("recentList");R.replaceChildren();
 products.slice(0,4).forEach(p=>R.appendChild(row(p,true)));
 if(!products.length)R.textContent="এখনও কোনো পণ্য নেই। \"পণ্য\" ট্যাবে গিয়ে প্রথম পণ্যটি যোগ করুন।";
}
function renderFilters(){
 const cats=[...new Set(products.map(p=>(p.category||"").trim()).filter(Boolean))].sort();
 const f=$("catFilter"),cur=f.value;f.replaceChildren(new Option("সব ক্যাটাগরি",""));
 cats.forEach(c=>f.appendChild(new Option(c,c)));f.value=cats.includes(cur)?cur:"";
 const dl=$("catOptions");dl.replaceChildren();cats.forEach(c=>dl.appendChild(new Option(c)));
}
function filtered(){
 const q=$("search").value.trim().toLowerCase(),c=$("catFilter").value,s=$("stateFilter").value;
 return products.filter(p=>(!q||(p.name||"").toLowerCase().includes(q))&&(!c||(p.category||"").trim()===c)&&
  (!s||(s==="visible"&&visible(p))||(s==="hidden"&&!visible(p))||(s==="out"&&stock(p)<=0)));
}
function renderList(){
 const list=filtered(),root=$("productList");root.replaceChildren();
 $("countLine").textContent=list.length.toLocaleString("bn-BD")+"টি পণ্য";
 if(!list.length){root.appendChild(el("div","card muted",products.length?"এই ফিল্টারে কোনো পণ্য মেলেনি।":"এখনও কোনো পণ্য নেই। \"+ নতুন পণ্য\" চেপে শুরু করুন।"));return}
 list.forEach(p=>root.appendChild(row(p,false)));
}
["search","catFilter","stateFilter"].forEach(id=>$(id).addEventListener("input",renderList));

function row(p,compact){
 const r=el("div","item");
 if(p.image_url){const i=el("img");i.src=p.image_url;i.alt=p.name||"";r.appendChild(i)}else r.appendChild(el("div","noimg"));
 const info=el("div","info");info.appendChild(el("strong","",p.name));
 const m=el("small","",[p.category,p.price].filter(Boolean).join(" · ")+" ");info.appendChild(m);
 if(!visible(p))m.appendChild(el("span","tag off","লুকানো"));
 if(stock(p)<=0)m.appendChild(el("span","tag off","স্টক শেষ"));else if(stock(p)<=LOW)m.appendChild(el("span","tag low","স্টক কম"));
 r.appendChild(info);
 const a=el("div","acts");
 const st=el("div","stock");
 const minus=el("button","btn light sm","−");minus.setAttribute("aria-label","স্টক কমান");minus.onclick=()=>changeStock(p,-1);
 const plus=el("button","btn light sm","+");plus.setAttribute("aria-label","স্টক বাড়ান");plus.onclick=()=>changeStock(p,1);
 st.append(minus,el("b","",stock(p).toLocaleString("bn-BD")),plus);a.appendChild(st);
 if(!compact){
  const v=el("button","btn light sm",visible(p)?"লুকান":"দেখান");v.onclick=()=>toggleVisible(p);
  const e=el("button","btn light sm","এডিট");e.onclick=()=>openForm(p);
  const d=el("button","btn danger sm","মুছুন");d.onclick=()=>removeProduct(p);
  a.append(v,e,d);
 }
 r.appendChild(a);return r;
}
async function changeStock(p,d){
 const n=Math.max(0,stock(p)+d);
 const {error}=await sb.from("products").update({stock_qty:n}).eq("id",p.id);
 if(error){toast("স্টক বদলায়নি: "+error.message);return}
 p.stock_qty=n;renderAll();
}
async function toggleVisible(p){
 const n=!visible(p);
 const {error}=await sb.from("products").update({is_visible:n}).eq("id",p.id);
 if(error){toast("বদলায়নি: "+error.message);return}
 p.is_visible=n;renderAll();toast(n?"সাইটে দেখানো হচ্ছে":"সাইট থেকে লুকানো হয়েছে");
}
async function removeProduct(p){
 if(!confirm("\""+p.name+"\" মুছে ফেলবেন? এটা ফেরানো যাবে না।"))return;
 const {error}=await sb.from("products").delete().eq("id",p.id);
 if(error){toast("মোছা হয়নি: "+error.message);return}
 toast("পণ্য মোছা হয়েছে");loadProducts();
}

/* ---------- Product form ---------- */
function openForm(p){
 $("productForm").reset();existingImage="";$("preview").classList.add("hidden");$("formStatus").textContent="";
 $("productId").value=p?p.id:"";
 $("formTitle").textContent=p?"পণ্য এডিট করুন":"নতুন পণ্য";
 if(p){
  $("name").value=p.name||"";$("subtitle").value=p.subtitle||"";$("category").value=p.category||"";$("price").value=p.price||"";
  $("stock").value=stock(p);$("description").value=p.description||"";
  $("features").value=Array.isArray(p.features)?p.features.join("\n"):"";
  $("is_visible").checked=visible(p);existingImage=p.image_url||"";
  if(existingImage){$("preview").src=existingImage;$("preview").classList.remove("hidden")}
 }
 $("dlg").showModal();
}
$("addBtn").onclick=()=>openForm(null);
$("cancelBtn").onclick=()=>$("dlg").close();
$("photo").onchange=()=>{
 const f=$("photo").files[0];if(!f)return;
 if(!f.type.startsWith("image/")||f.size>5*1024*1024){$("formStatus").textContent="৫ MB-এর কম একটি ছবি দিন।";$("photo").value="";return}
 $("preview").src=URL.createObjectURL(f);$("preview").classList.remove("hidden");
};
async function uploadPhoto(file){
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const path="products/"+Date.now()+"-"+Math.random().toString(36).slice(2,9)+"."+ext;
 const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
 if(error)throw new Error("ছবি আপলোড হয়নি: "+error.message);
 return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
$("productForm").onsubmit=async e=>{
 e.preventDefault();const btn=$("saveBtn");btn.disabled=true;$("formStatus").textContent="সেভ হচ্ছে...";
 try{
  let image_url=existingImage;const f=$("photo").files[0];if(f)image_url=await uploadPhoto(f);
  const payload={
   name:$("name").value.trim(),subtitle:$("subtitle").value.trim(),category:$("category").value.trim(),
   description:$("description").value.trim(),price:$("price").value.trim(),
   features:$("features").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),
   stock_qty:Number($("stock").value),is_visible:$("is_visible").checked,image_url
  };
  if(!payload.name)throw new Error("পণ্যের নাম লিখুন।");
  if(!Number.isInteger(payload.stock_qty)||payload.stock_qty<0)throw new Error("স্টক শূন্য বা তার বেশি পূর্ণসংখ্যা হতে হবে।");
  const id=$("productId").value;
  const res=id?await sb.from("products").update(payload).eq("id",id):await sb.from("products").insert(payload);
  if(res.error)throw res.error;
  $("dlg").close();toast("পণ্য সেভ হয়েছে");loadProducts();
 }catch(err){$("formStatus").textContent="সমস্যা: "+(err.message||err)}
 finally{btn.disabled=false}
};

/* ---------- Site settings ---------- */
const KEYS=["tagline","announcement","phone","address","facebook"];
async function loadSettings(){
 const {data,error}=await sb.from("site_settings").select("*");
 if(error){toast("সেটিংস লোড হয়নি: "+error.message);return}
 (data||[]).forEach(r=>{if(KEYS.includes(r.key))$("s_"+r.key).value=r.value||""});
}
$("saveSettings").onclick=async()=>{
 const rows=KEYS.map(k=>({key:k,value:$("s_"+k).value.trim()}));
 const {error}=await sb.from("site_settings").upsert(rows,{onConflict:"key"});
 toast(error?"সেভ হয়নি: "+error.message:"সেটিংস সেভ হয়েছে");
};
</script>
